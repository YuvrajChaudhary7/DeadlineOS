services:
  app:
    build: .
    ports: ["5000:5000"]
    env_file: .env
    volumes: ["uploads_data:/app/backend/instance/uploads"]
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg://deadlineos:${POSTGRES_PASSWORD}@db:5432/deadlineos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deadlineos
      POSTGRES_USER: deadlineos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlineos -d deadlineos"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  uploads_data:
