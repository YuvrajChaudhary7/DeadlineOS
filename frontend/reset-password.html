<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password recovery · DeadlineOS</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><a class="brand" href="index.html">DeadlineOS<span>.</span></a></header>
<main class="form"><p class="eyebrow">ACCOUNT RECOVERY</p><h1 id="form-title">Reset your password</h1>
<form id="request-form"><p>Enter the email address on your account. If recovery is configured and the account is active, we’ll email a reset link.</p><label>Email<input name="email" type="email" autocomplete="email" required></label><button class="button" type="submit">Send recovery link</button></form>
<form id="confirm-form" class="hidden"><p>Choose a new password with at least 12 characters.</p><label>New password<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button class="button" type="submit">Save new password</button></form>
<p id="message" role="status" aria-live="polite"></p><p><a href="login.html">Return to sign in</a></p></main><script src="js/app.js"></script><script src="js/password-reset.js"></script></body></html>
