<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deadlines · DeadlineOS</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body><header><a class="brand" href="index.html">DeadlineOS<span>.</span></a><nav aria-label="Primary navigation"><a id="dashboard-link" class="hidden" href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="deadlines.html" aria-current="page">Deadlines</a><a href="submissions.html">Submissions</a><a href="notifications.html">Inbox</a><a id="student-tasks-link" class="hidden" href="tasks.html">My Tasks</a><a id="staff-analytics-link" class="hidden" href="analytics.html">Analytics</a><a id="admin-link" class="hidden" href="admin.html">Admin</a><span id="user-name" class="user-pill"></span><button class="button button-quiet" id="logout">Sign out</button></nav></header>
<main><p class="eyebrow">MAKE TIME FOR WHAT MATTERS</p><div class="page-heading"><div><h1>Deadlines</h1><p class="lede" id="page-intro">All your upcoming coursework in one place.</p></div><span class="role-tag" id="role-tag"></span></div><p id="message" class="notice" role="status" aria-live="polite"></p><form id="deadline-form" class="panel form-grid hidden"><div><p class="eyebrow">STAFF WORKSPACE</p><h2>Publish an assignment</h2></div><label>Course<select name="course_id" id="course-select" required></select></label><label>Assignment title<input name="title" required maxlength="160" placeholder="Midterm project"></label><label>Due date and time<input name="due_at" type="datetime-local" required></label><label>Maximum marks<input name="max_marks" type="number" min="1" value="100" required></label><label class="resubmission-toggle"><input name="allow_resubmissions" type="checkbox"> Allow student resubmissions</label><label>Maximum attempts<select name="max_attempts"><option value="1">1 attempt</option><option value="2">2 attempts</option><option value="3">3 attempts</option><option value="5">5 attempts</option></select></label><label class="span-all">Instructions<textarea name="description" rows="3" placeholder="Submission requirements"></textarea></label><button class="button">Publish deadline</button></form><div class="section-heading"><div><h2>Assignment board</h2><p id="deadline-count" class="lede" aria-live="polite"></p></div><div class="filter-row" role="group" aria-label="Filter deadlines by time"><button class="filter active" data-filter="all" aria-pressed="true">All</button><button class="filter" data-filter="upcoming" aria-pressed="false">Upcoming</button><button class="filter" data-filter="past" aria-pressed="false">Past</button><button class="filter hidden" data-filter="closed" aria-pressed="false">Closed</button></div></div><div class="deadline-tools"><label class="deadline-search">Search assignments<input id="deadline-search" type="search" placeholder="Search title, course or instructions" autocomplete="off"></label><label>Course<select id="course-filter"><option value="all">All courses</option></select></label><label>Sort by<select id="deadline-sort"><option value="soonest">Due soonest</option><option value="latest">Due latest</option><option value="title">Title A–Z</option></select></label><button id="clear-deadline-filters" class="button button-quiet" type="button">Clear filters</button></div><section id="deadline-list" class="cards"></section></main><script src="js/app.js"></script><script src="js/deadlines.js"></script></body></html>
