<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tasks · DeadlineOS</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body><header><a class="brand" href="index.html">DeadlineOS<span>.</span></a><nav><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="deadlines.html">Deadlines</a><a href="submissions.html">Submissions</a><a href="notifications.html">Inbox</a><a href="tasks.html" aria-current="page">My Tasks</a><a id="staff-analytics-link" class="hidden" href="analytics.html">Analytics</a><a id="admin-link" class="hidden" href="admin.html">Admin</a><span id="user-name" class="user-pill"></span><button class="button button-quiet" id="logout">Sign out</button></nav></header>
<main><p class="eyebrow">YOUR PERSONAL PLANNER</p><div class="page-heading"><div><h1>My Tasks</h1><p class="lede">Keep personal project deadlines alongside your course work.</p></div><span class="role-tag" id="role-tag"></span></div><p id="message" class="notice" role="status"></p><form id="task-form" class="panel form-grid"><div><p class="eyebrow">PLAN AHEAD</p><h2>Add a personal deadline</h2></div><label>Task or project<input name="title" maxlength="160" placeholder="Finish science fair prototype" required></label><label>Due date and time<input name="due_at" type="datetime-local" required></label><label>Priority<select name="priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></label><label>Repeat<select name="recurrence"><option value="none">Does not repeat</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label><label class="span-all">Notes<textarea name="description" rows="2" maxlength="2000" placeholder="What needs to get done?"></textarea></label><button class="button">Add to my list</button></form><div class="section-heading"><h2>My checklist</h2><div class="filter-row"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="todo">To do</button><button class="filter" data-filter="complete">Completed</button></div></div><section id="task-list" class="cards"></section></main><script src="js/app.js"></script><script src="js/tasks.js"></script></body></html>
