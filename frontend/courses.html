<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses · DeadlineOS</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"></head>
<body><header><a class="brand" href="index.html">DeadlineOS<span>.</span></a><nav><a id="dashboard-link" class="hidden" href="dashboard.html">Dashboard</a><a href="courses.html" aria-current="page">Courses</a><a href="deadlines.html">Deadlines</a><a href="submissions.html">Submissions</a><a href="notifications.html">Inbox</a><a id="student-tasks-link" class="hidden" href="tasks.html">My Tasks</a><a id="staff-analytics-link" class="hidden" href="analytics.html">Analytics</a><a id="admin-link" class="hidden" href="admin.html">Admin</a><span id="user-name" class="user-pill"></span><button class="button button-quiet" id="logout">Sign out</button></nav></header>
<main><p class="eyebrow">YOUR LEARNING SPACE</p><div class="page-heading"><div><h1>Courses</h1><p class="lede">Explore your courses and keep every class organized.</p></div><span class="role-tag" id="role-tag"></span></div><p id="message" class="notice" role="status"></p><form id="course-form" class="panel form-grid hidden"><div><p class="eyebrow">STAFF WORKSPACE</p><h2>Create a course</h2></div><label>Course code<input name="code" placeholder="CS205" maxlength="20" required></label><label>Course name<input name="name" placeholder="Data Structures" required></label><label>Credits<input name="credits" type="number" min="1" max="10" value="3" required></label><label class="span-all">Description<textarea name="description" rows="2" placeholder="What students will learn"></textarea></label><button class="button">Create course</button></form><form id="announcement-form" class="panel form-grid hidden"><div><p class="eyebrow">COURSE UPDATES</p><h2>Post an announcement</h2></div><label>Course<select id="announcement-course" name="course_id" required></select></label><label>Title<input name="title" maxlength="160" required></label><label class="span-all">Announcement<textarea name="body" rows="3" maxlength="4000" required></textarea></label><button class="button">Post announcement</button></form><section id="course-list" class="cards"></section><section class="announcement-section"><div class="section-heading"><div><p class="eyebrow">COURSE UPDATES</p><h2>Announcements</h2></div></div><div id="announcement-list" class="announcement-list"></div></section></main><script src="js/app.js"></script><script src="js/courses.js"></script></body></html>
