name: Deploy Azure Container App

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deadlineos-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify application before deployment
        env:
          TEST_DATABASE_URL: sqlite://
          JWT_SECRET_KEY: ci-only-not-for-deployment
          SEED_DEMO: "false"
          ENABLE_REMINDERS: "false"
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s tests -v
          python scripts/clean_install_check.py
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade
      - name: Build and push image to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          ACR_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          az acr login --name "$ACR_NAME"
          docker build --pull -t "$ACR_SERVER/deadlineos:$IMAGE_TAG" .
          docker push "$ACR_SERVER/deadlineos:$IMAGE_TAG"
          echo "IMAGE_URI=$ACR_SERVER/deadlineos:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Prepare upload persistence smoke check
        id: upload_smoke
        if: ${{ vars.DEPLOY_SMOKE_PROJECT_ID != '' }}
        env:
          DEADLINEOS_SMOKE_EMAIL: ${{ secrets.DEPLOY_SMOKE_EMAIL }}
          DEADLINEOS_SMOKE_PASSWORD: ${{ secrets.DEPLOY_SMOKE_PASSWORD }}
          SMOKE_PROJECT_ID: ${{ vars.DEPLOY_SMOKE_PROJECT_ID }}
        run: |
          FQDN="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          python scripts/deployment_smoke_check.py prepare --base-url "https://$FQDN" --project-id "$SMOKE_PROJECT_ID" --output "$GITHUB_OUTPUT"
      - name: Deploy image
        run: az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE_URI" --output none
      - name: Check deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-connrefused "https://$FQDN/api/health"
      - name: Verify upload survived the new revision
        if: ${{ vars.DEPLOY_SMOKE_PROJECT_ID != '' }}
        env:
          DEADLINEOS_SMOKE_EMAIL: ${{ secrets.DEPLOY_SMOKE_EMAIL }}
          DEADLINEOS_SMOKE_PASSWORD: ${{ secrets.DEPLOY_SMOKE_PASSWORD }}
          SMOKE_PROJECT_ID: ${{ vars.DEPLOY_SMOKE_PROJECT_ID }}
          SMOKE_FILE_ID: ${{ steps.upload_smoke.outputs.file_id }}
          SMOKE_SHA256: ${{ steps.upload_smoke.outputs.sha256 }}
        run: |
          FQDN="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          python scripts/deployment_smoke_check.py verify --base-url "https://$FQDN" --project-id "$SMOKE_PROJECT_ID" --file-id "$SMOKE_FILE_ID" --sha256 "$SMOKE_SHA256"
      - name: Clean up persistence smoke upload
        if: ${{ always() && vars.DEPLOY_SMOKE_PROJECT_ID != '' && steps.upload_smoke.outputs.file_id != '' }}
        env:
          DEADLINEOS_SMOKE_EMAIL: ${{ secrets.DEPLOY_SMOKE_EMAIL }}
          DEADLINEOS_SMOKE_PASSWORD: ${{ secrets.DEPLOY_SMOKE_PASSWORD }}
          SMOKE_PROJECT_ID: ${{ vars.DEPLOY_SMOKE_PROJECT_ID }}
          SMOKE_FILE_ID: ${{ steps.upload_smoke.outputs.file_id }}
        run: |
          FQDN="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          python scripts/deployment_smoke_check.py cleanup --base-url "https://$FQDN" --project-id "$SMOKE_PROJECT_ID" --file-id "$SMOKE_FILE_ID"

